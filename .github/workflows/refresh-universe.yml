name: Refresh S&P 500 list

# Rebuilds app/lib/sp500.js from the current index constituents once a week
# and commits it when it changed. The push to main redeploys the site. The
# script refuses to write a list that does not look like the S&P 500.

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-universe
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Rebuild the list
        run: node scripts/refresh-sp500.mjs
      - name: Build before committing
        run: |
          if git diff --quiet; then echo "No change."; exit 0; fi
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit when changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/sp500.js
          git commit -m "chore(data): refresh S&P 500 constituents"
          git push
