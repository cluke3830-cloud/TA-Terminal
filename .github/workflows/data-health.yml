name: Data health

# Calls every live data route of the production site twice each weekday.
# If a source is broken or stale the run fails, and an issue is opened (or
# updated) with the report. When everything passes again the issue is closed.
# No secrets are needed: the check reads the public site.

on:
  schedule:
    - cron: '20 14 * * 1-5'   # shortly before the US open
    - cron: '40 21 * * 1-5'   # after the US close
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to check
        default: https://ta-terminal-orcin.vercel.app

permissions:
  contents: read
  issues: write

concurrency:
  group: data-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ inputs.base_url || 'https://ta-terminal-orcin.vercel.app' }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: 'Data health: a live source is broken or stale'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check every live route
        id: check
        run: node scripts/check-live-data.mjs
        continue-on-error: true

      - name: Publish the report
        if: always()
        run: cat data-health-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the issue on failure
        if: steps.check.outcome == 'failure'
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file data-health-report.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file data-health-report.md
          fi

      - name: Close the issue once everything passes
        if: steps.check.outcome == 'success'
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "All checks pass again. $(head -n 3 data-health-report.md | tail -n 1)"
          fi

      - name: Fail the run if a check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
